<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>HD-2D実験室</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#08111a;color:#f5f0df}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#08111a}#world{display:block;width:100vw;height:100dvh;touch-action:none}.top{position:fixed;z-index:2;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border:1px solid #8aa0a3;background:#10202ad9;border-radius:13px;box-shadow:0 4px 20px #0008}button,.file{font:inherit;color:inherit;background:#1c3540;border:1px solid #63818a;border-radius:8px;padding:8px 10px;cursor:pointer}button.active{background:#bf7447;color:#fff8d8;border-color:#ffd580}button:hover{background:#2d5962}.brand{font-weight:800;padding:8px 10px;color:#f8cd86}.panel{position:fixed;z-index:2;right:14px;bottom:14px;width:min(285px,calc(100vw - 28px));background:#0c1922e8;border:1px solid #66818b;border-radius:12px;padding:12px;box-shadow:0 8px 32px #0009}.panel h2{font-size:14px;margin:0 0 9px;color:#f5cf8d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:13px}.grid label{display:flex;align-items:center;gap:5px}.range{grid-column:span 2;display:grid!important;grid-template-columns:55px 1fr;align-items:center;gap:8px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.file input{display:none}#status{position:fixed;z-index:2;left:14px;bottom:14px;font-size:12px;padding:7px 10px;border-radius:8px;background:#0c1922d9;border:1px solid #45636e}#status[data-bad=true]{border-color:#d36b58;color:#ffb4a5}.collapse{display:none}.notice{position:fixed;z-index:1;inset:0;display:grid;place-items:center;pointer-events:none;color:#d6e4dd;font-size:14px;text-shadow:0 1px 5px #000}@media(max-width:620px){.brand{display:none}.panel{bottom:42px}.panel.collapsed .panel-body{display:none}.collapse{display:inline-block}.top{max-width:calc(100vw - 20px)}#status{bottom:9px;left:9px;font-size:11px}.panel{right:9px;width:min(285px,calc(100vw - 18px))}}@media(min-width:621px){#toggle-controls{display:none}}</style></head><body><canvas id="world" aria-label="HD-2D風の街と森の3D背景"></canvas><div class="notice">背景を準備しています…</div><nav class="top" aria-label="マップ"><span class="brand">HD-2D 背景実験</span><button data-map="town" class="active" aria-pressed="true">街</button><button data-map="forest" aria-pressed="false">森</button></nav><aside class="panel" id="controls"><button class="collapse" id="toggle-controls">調整</button><div class="panel-body"><h2>表示調整</h2><div class="grid"><label class="range">ズーム <input id="zoom" type="range" min=".7" max="1.65" step=".05" value="1"></label><label class="range">視点 <input id="yaw" type="range" min="-.35" max=".35" step=".02" value="0"></label><label><input data-setting="dusk" type="checkbox">夕方の照明</label><label><input data-setting="lightweight" type="checkbox">軽量描画</label><label><input data-setting="shadows" type="checkbox" checked>影</label><label><input data-setting="effects" type="checkbox" checked>効果</label><label><input data-setting="paused" type="checkbox">時間停止</label></div><div class="actions"><button id="reset">初期化</button><button id="save">設定JSON保存</button><label class="file">復元<input id="restore" type="file" accept="application/json"></label></div></div></aside><output id="status" aria-live="off">読込中…</output><script>/* BUNDLE */</script></body></html>
