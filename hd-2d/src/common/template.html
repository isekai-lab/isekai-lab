<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>HD-2D実験室</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,sans-serif; background: #08111a; color: #f5f0df }
    * { box-sizing: border-box }
    body { margin: 0; overflow: hidden; background: #08111a }
    #world { display: block; width: 100vw; height: 100dvh; touch-action: none }
    .top { position: fixed; z-index: 2; top: max(8px,env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 5px; max-width: calc(100vw - 16px); padding: 5px; border: 1px solid #8aa0a3; background: #10202ae8; border-radius: 13px; box-shadow: 0 4px 20px #0008; white-space: nowrap }
    button, .file, a { font: inherit; color: inherit; background: #1c3540; border: 1px solid #63818a; border-radius: 8px; padding: 7px 9px; cursor: pointer; text-decoration: none }
    button:disabled { opacity: .5; cursor: default }
    button.active { background: #bf7447; color: #fff8d8; border-color: #ffd580 }
    .brand { font-weight: 800; padding: 7px; color: #f8cd86 }
    .map-buttons { display: flex; gap: 4px }
    .panel { position: fixed; z-index: 2; right: 12px; bottom: 12px; width: min(310px,calc(100vw - 24px)); max-height: calc(100dvh - 80px); overflow: auto; background: #0c1922ed; border: 1px solid #66818b; border-radius: 12px; padding: 11px; box-shadow: 0 8px 32px #0009 }
    .panel h2 { font-size: 14px; margin: 0 0 9px; color: #f5cf8d }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; font-size: 13px }
    .grid label { display: flex; align-items: center; gap: 5px }
    .range { grid-column: span 2; display: grid!important; grid-template-columns: 55px minmax(0,1fr); gap: 8px }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px }
    .file input { display: none }
    .metrics { display: grid; gap: 4px; margin-top: 9px; font-size: 12px }
    #status, #live-fps { position: fixed; z-index: 2; left: 10px; bottom: 10px; font-size: 12px; padding: 7px 10px; border-radius: 8px; background: #0c1922df; border: 1px solid #45636e }
    #live-fps { left: auto; right: 10px; bottom: auto; top: 58px }
    #status[data-bad=true] { border-color: #d36b58; color: #ffb4a5 }
    .collapse { display: none }
    .notice { position: fixed; z-index: 1; inset: 0; display: grid; place-items: center; pointer-events: none }
    @media (max-width: 700px) {
      .brand { display: none }
      .top { overflow-x: auto }
      .panel { right: 7px; bottom: 40px; width: min(310px,calc(100vw - 14px)) }
      .panel.collapsed .panel-body { display: none }
      .collapse { display: inline-block }
      #status { left: 7px; bottom: 7px; max-width: calc(100vw - 14px) }
      #live-fps { top: 56px; right: 7px }
    }
  </style>
</head>
<body>
  <canvas id="world" aria-label="HD-2D風の3D背景"></canvas>
  <div class="notice">背景を準備しています…</div>
  <nav class="top" aria-label="ページとマップ">
    <span class="brand">HD-2D 実験</span>
    <a href="index.html">ビュー</a><a href="maps.html">マップ</a><a href="characters.html">人物</a>
    <span class="map-buttons"><button data-map="town">街</button><button data-map="forest">森</button><button data-map="cave">洞窟</button></span>
  </nav>
  <aside class="panel" id="controls">
    <button class="collapse" id="toggle-controls">調整</button>
    <div class="panel-body">
      <h2>表示調整</h2>
      <div class="grid">
        <label class="range">ズーム <input id="zoom" type="range" min=".7" max="1.65" step=".05" value="1"></label>
        <label class="range">視点 <input id="yaw" type="range" min="-.35" max=".35" step=".01" value="0"></label>
        <label><input data-setting="dusk" type="checkbox">夕方の照明</label>
        <label><input data-setting="lightweight" type="checkbox">軽量描画</label>
        <label><input data-setting="shadows" type="checkbox" checked>影</label>
        <label><input data-setting="effects" type="checkbox" checked>効果</label>
        <label><input data-setting="paused" type="checkbox">時間停止</label>
      </div>
      <div class="actions">
        <button id="reset">初期化</button><button id="save">設定JSON</button>
        <label class="file">設定復元<input id="restore" type="file" accept="application/json"></label>
        <button id="benchmark">2秒+10秒計測</button><button id="export-report" disabled>結果JSON</button><button id="capture-png" disabled>シーンPNG</button>
      </div>
      <div class="metrics"><output id="benchmark-summary">未計測</output></div>
    </div>
  </aside>
  <output id="status" aria-live="polite">読込中…</output><output id="live-fps">-- FPS</output>
  <script>/* BUNDLE */</script>
</body>
</html>
